<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuigtassen Hertogs</title>
<meta name="description" content="Een handgenaaide tas uit een oud paardenzadel — uniek, in één exemplaar.">
<!-- TODO bij livegang: deze regel schrappen. Cloudflare vervangt robots.txt
     door een eigen bestand, dus het weren van zoekmachines moet hier. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="assets/site.js"></script>
</head>
<body data-page="collectie" class="bg-background text-on-background noise-overlay relative overflow-x-hidden antialiased selection:bg-secondary-fixed selection:text-primary">

<header id="site-header" class="sticky top-0 z-50 bg-background/95 backdrop-blur-sm border-b-2 border-dashed border-secondary/30"></header>

<main id="product" class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-12 md:py-20"></main>

<section id="ook-interessant" class="bg-surface-container-lowest golfrand-boven -mt-8 relative">
  <div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-stack-raw md:py-section-xl">
    <h2 class="font-display-lg text-[40px] md:text-[52px] leading-tight text-primary rotate-1 mb-12 pb-4 border-b-2 border-dashed border-secondary">Andere tassen in het atelier</h2>
    <div id="ander-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12 mb-6 md:mb-8"></div>
  </div>
</section>

<footer id="site-footer" class="relative z-10 bg-surface-container-lowest golfrand-boven -mt-8"></footer>

<!-- Foto in het groot: geen uitsnede, de hele tas in beeld. -->
<!-- Kleur en overgang van dit venster staan in styles.css, bij #lightbox. -->
<dialog id="lightbox" class="w-screen max-w-none h-screen max-h-none bg-transparent p-0">
  <div class="w-full h-full flex flex-col md:flex-row items-center justify-center gap-4 md:gap-8 p-4 md:p-12 cursor-zoom-out">
    <span aria-hidden="true" class="material-symbols-outlined absolute top-4 right-4 md:top-8 md:right-8 p-3 text-[32px] text-white">close</span>
    <img id="lightbox-foto" alt="" class="min-h-0 max-w-full max-h-full object-contain">
    <!-- De andere foto's van deze tas: onder het beeld op een smal scherm,
         ernaast zodra er plaats is. -->
    <div id="lightbox-strip" class="flex flex-row md:flex-col gap-3 shrink-0 overflow-auto max-w-full md:max-h-full cursor-default"></div>
  </div>
</dialog>

<script>
paginaKlaar.then(() => {
  const id = new URLSearchParams(location.search).get('id');
  const p = productById(id);
  const root = document.getElementById('product');

  if (!p) {
    document.getElementById('ook-interessant').hidden = true;
    root.innerHTML = `
      <div class="py-24 text-center max-w-lg mx-auto">
        <h1 class="font-display-lg text-[40px] md:text-[52px] leading-tight rotate-1 text-primary mb-4">Deze tas vonden we niet</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant mb-8">
          Mogelijk is ze intussen verkocht — elk stuk bestaat maar één keer.
        </p>
        <a href="collectie.html" class="inline-flex items-center gap-2 bg-primary text-on-primary px-8 py-4 rounded font-label-sm text-label-sm uppercase tracking-widest hover:bg-tertiary transition-colors">
          Bekijk de collectie
        </a>
      </div>`;
    return;
  }

  document.title = `${p.naam} — Tuigtassen Hertogs`;
  const uitverkocht = p.voorraad < 1;

  // Nog niet ingevulde specificaties laten we gewoon weg: liever een korter
  // lijstje dan een regel met niets erachter.
  const spec = (icoon, label, waarde) => !waarde ? '' : `
    <div class="flex items-start gap-4">
      <span class="material-symbols-outlined text-secondary mt-1">${icoon}</span>
      <div>
        <h3 class="font-label-mono text-label-mono uppercase text-secondary mb-1">${label}</h3>
        <p class="font-body-md text-body-md text-primary">${waarde}</p>
      </div>
    </div>`;

  root.innerHTML = `
    <nav class="font-label-sm text-label-sm uppercase tracking-widest text-secondary mb-10">
      <a href="collectie.html" class="hover:text-primary transition-colors">Collectie</a>
      <span class="mx-2 text-outline-variant">/</span>
      <span class="text-on-surface-variant">${p.naam}</span>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start">

      <div class="lg:col-span-7">
        <div class="relative aspect-[4/5] mb-8">
          <div class="absolute inset-0 hide-mask soft-edge-mask saddle-stitch overflow-hidden bg-surface-container-low">
            <!-- De huidvorm snijdt de foto aan; klikken toont ze volledig. -->
            <button type="button" data-vergroot class="block w-full h-full cursor-zoom-in"
                    aria-label="Bekijk de volledige foto van ${p.naam}">
              <img id="hoofdfoto" src="${fotoUrl(p.fotos[0])}" alt="${p.naam}" class="w-full h-full object-cover">
            </button>
          </div>
        </div>
        <p class="font-label-mono text-label-mono uppercase text-secondary mb-8 -mt-4">
          Klik op de foto voor het volledige beeld
        </p>
        ${p.fotos.length > 1 ? `
        <div class="flex gap-4">
          ${p.fotos.map((f, i) => `
            <button type="button" data-foto="${fotoUrl(f)}"
                    class="w-20 h-24 bg-surface-container-lowest p-1 border border-dashed border-secondary/50 ${i === 0 ? 'border-solid border-primary' : ''}"
                    aria-label="Foto ${i + 1} van ${p.naam}">
              <img src="${fotoUrl(f)}" alt="" class="w-full h-full object-cover">
            </button>`).join('')}
        </div>` : ''}
      </div>

      <div class="lg:col-span-5 lg:sticky lg:top-28">
        <span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary">${p.herkomst}</span>
        <h1 class="font-display-lg text-[48px] md:text-[64px] text-primary leading-tight mt-3 mb-4 -rotate-1">${p.naam}</h1>
        <p class="inline-block font-label-mono text-label-mono bg-surface-container-high border border-secondary text-on-surface-variant px-3 py-1.5 mb-6">${euro.format(p.prijs)}</p>

        <div class="w-16 stitch-divider-dubbel mb-8"></div>

        <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed mb-8">${p.verhaal}</p>

        ${p.kenmerken?.length ? `
        <ul class="mb-8 space-y-2">
          ${p.kenmerken.map((k) => `
            <li class="flex gap-3 font-body-md text-body-md text-on-surface-variant">
              <span class="text-secondary" aria-hidden="true">—</span>${k}
            </li>`).join('')}
        </ul>` : ''}

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-5 py-8 border-y-2 border-dashed border-secondary/40 mb-8">
          ${spec('layers', 'Herkomst leder', p.herkomst)}
          ${spec('palette', 'Kleur', p.kleur)}
          ${spec('straighten', 'Afmetingen', p.afmetingen)}
        </div>

        ${uitverkocht ? `
          <div class="bg-surface-container p-6 mb-6">
            <p class="font-body-md text-body-md text-on-surface-variant">
              Deze tas is verkocht. Er was er maar één van — maar er ligt altijd ander leder klaar.
            </p>
          </div>
          <a data-wa="Dag Karolien, ${p.naam} is verkocht. Kan je iets vergelijkbaars maken? " target="_blank" rel="noopener"
             class="w-full py-5 bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest hover:bg-tertiary transition-colors duration-300 flex items-center justify-center gap-3 rounded-lg">
            <span class="material-symbols-outlined text-base">chat</span> Vraag naar iets gelijkaardigs
          </a>
        ` : `
          <button type="button" data-add="${p.id}"
                  class="w-full py-5 bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest hover:bg-tertiary transition-colors duration-300 flex items-center justify-center gap-3 rounded-lg group">
            <span>In mijn mandje</span>
            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform duration-300">arrow_right_alt</span>
          </button>
          <a href="bestellen.html" class="w-full mt-3 py-4 stitched-border text-primary font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-container-low transition-colors duration-300 flex items-center justify-center rounded-lg">
            Naar het mandje
          </a>
        `}

        <div class="bg-surface-container-low p-6 mt-8 flex gap-4 items-start border-l-[3px] border-secondary">
          <span class="material-symbols-outlined symbol-filled text-secondary shrink-0">verified</span>
          <div>
            <h4 class="font-label-sm text-label-sm uppercase tracking-widest text-primary mb-1">Eén exemplaar</h4>
            <p class="font-body-md text-body-md text-on-surface-variant">
              Volledig met de hand genaaid in het atelier van Karolien. Elk stuk komt uit een ander zadel,
              dus deze tas bestaat exact één keer. Gratis en verzekerd verzonden binnen België.
            </p>
          </div>
        </div>

        <p class="font-body-md text-body-md text-on-surface-variant mt-6">
          Een vraag over deze tas?
          <a data-wa="Dag Karolien, ik heb een vraag over ${p.naam}: " target="_blank" rel="noopener"
             class="text-primary border-b border-secondary-fixed-dim hover:border-primary transition-colors">Stuur me een berichtje.</a>
        </p>
      </div>
    </div>`;

  /* Eén plek die bijhoudt welke foto in beeld staat. De strook onder de foto
     en die in het vergrote venster wijzen naar dezelfde teller, dus je verliest
     je plaats niet wanneer je in- of uitzoomt. */
  const lightbox = document.getElementById('lightbox');
  const strook = document.getElementById('lightbox-strip');
  let actief = 0;

  const kies = (i) => {
    actief = i;
    const url = fotoUrl(p.fotos[i]);
    document.getElementById('hoofdfoto').src = url;
    document.getElementById('lightbox-foto').src = url;
    root.querySelectorAll('[data-foto]').forEach((k, n) => {
      k.classList.toggle('ring-2', n === i);
      k.classList.toggle('ring-primary', n === i);
    });
    strook.querySelectorAll('[data-groot]').forEach((k, n) => {
      k.classList.toggle('border-white', n === i);
      k.classList.toggle('border-white/30', n !== i);
    });
  };

  // Strook in het vergrote venster. Bij één foto heeft ze geen nut.
  strook.innerHTML = p.fotos.length < 2 ? '' : p.fotos.map((f, i) => `
    <button type="button" data-groot="${i}"
            class="w-16 h-16 md:w-20 md:h-20 shrink-0 overflow-hidden rounded border-2 ${i === 0 ? 'border-white' : 'border-white/30'} hover:border-white/70 transition-colors"
            aria-label="Foto ${i + 1} van ${p.naam}">
      <img src="${fotoUrl(f)}" alt="" class="w-full h-full object-cover">
    </button>`).join('');

  strook.addEventListener('click', (e) => {
    e.stopPropagation();                       // anders sluit het venster meteen
    const knop = e.target.closest('[data-groot]');
    if (knop) kies(Number(knop.dataset.groot));
  });

  root.querySelectorAll('[data-foto]').forEach((knop, i) => {
    knop.addEventListener('click', () => kies(i));
  });

  root.querySelector('[data-vergroot]').addEventListener('click', () => {
    kies(actief);
    document.getElementById('lightbox-foto').alt = p.naam;
    lightbox.showModal();
  });
  // Klik naast de foto sluit weer — Escape doet <dialog> zelf al.
  lightbox.addEventListener('click', () => lightbox.close());

  // WhatsApp-links binnen de zojuist gerenderde HTML alsnog invullen.
  root.querySelectorAll('[data-wa]').forEach((el) => { el.href = wa(el.dataset.wa); });

  const anderen = PRODUCTS.filter((x) => x.id !== p.id).slice(0, 3);
  document.getElementById('ander-grid').innerHTML = anderen.map((x) => productCard(x)).join('');
});
</script>
</body>
</html>
