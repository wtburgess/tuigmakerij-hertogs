<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bedankt voor je bestelling — Tuigtassen Hertogs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="assets/site.js"></script>
</head>
<body data-page="bestellen" class="bg-background text-on-background noise-overlay relative overflow-x-hidden antialiased min-h-screen flex flex-col">

<header class="w-full flex justify-center items-center py-8 bg-background border-b-2 border-dashed border-secondary/30">
  <a href="index.html">
    <img src="assets/logo.png" alt="Tuigtassen Hertogs" width="600" height="296" class="h-14 w-auto">
  </a>
</header>

<main class="flex-grow max-w-3xl mx-auto w-full px-margin-mobile py-16 md:py-24">

  <div class="text-center mb-16">
    <span class="material-symbols-outlined symbol-filled text-5xl text-primary mb-6">check_circle</span>
    <h1 class="font-display-lg text-display-lg-mobile md:text-[64px] text-primary mb-6 -rotate-1">Bedankt voor je bestelling</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">
      Je tas staat op mijn naam gereserveerd. Hieronder vind je wat je nog moet doen —
      dezelfde gegevens stuur ik je ook per mail.
    </p>
  </div>

  <div id="overzicht"></div>

  <div class="text-center mt-16">
    <a href="collectie.html#voorraad" class="inline-flex items-center gap-2 stitched-border text-primary px-8 py-4 rounded font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface-container-low transition-colors">
      Terug naar de collectie
    </a>
  </div>
</main>

<footer id="site-footer" class="relative z-10 bg-surface-container-lowest golfrand-boven -mt-8"></footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const root = document.getElementById('overzicht');
  let bestelling = null;
  try { bestelling = JSON.parse(sessionStorage.getItem('th-last-order')); } catch {}

  if (!bestelling) {
    root.innerHTML = `
      <p class="font-body-lg text-body-lg text-on-surface-variant text-center">
        We vonden hier geen recente bestelling. Heb je toch besteld en zie je niets?
        <a data-wa="Dag Karolien, ik heb besteld maar zie geen bevestiging. " target="_blank" rel="noopener"
           class="text-primary border-b border-secondary-fixed-dim hover:border-primary transition-colors">Laat het me weten.</a>
      </p>`;
    root.querySelectorAll('[data-wa]').forEach((el) => { el.href = wa(el.dataset.wa); });
    return;
  }

  const mededeling = bestelling.referentie;
  const mailBody =
    `Bestelling ${mededeling}\n\n` +
    bestelling.regels.map((r) => `${r.aantal}x ${r.tas} — ${euro.format(r.bedrag)}`).join('\n') +
    `\n${bestelling.levering} — ${bestelling.opAanvraag ? 'verzendkost nog te bepalen'
      : bestelling.verzendkost ? euro.format(bestelling.verzendkost) : 'gratis'}` +
    `\nTotaal: ${euro.format(bestelling.totaal)}${bestelling.opAanvraag ? ' + verzending' : ''}\n\n` +
    `${bestelling.klant.naam}\n${bestelling.klant.adres}\n${bestelling.klant.email}` +
    (bestelling.klant.telefoon ? `\n${bestelling.klant.telefoon}` : '') +
    (bestelling.klant.bericht ? `\n\nBericht: ${bestelling.klant.bericht}` : '');

  root.innerHTML = `
    <div class="bg-secondary-fixed p-8 md:p-10 border-2 border-dashed border-secondary/50 rounded-lg mb-8">
      <div class="text-center mb-8">
        <span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Bestelnummer</span>
        <p class="font-headline-md text-headline-md text-on-surface-variant mt-1">${mededeling}</p>
      </div>
      <div class="stitch-divider"></div>
      <div class="my-8 space-y-4">
        ${bestelling.regels.map((r) => `
          <div class="flex justify-between gap-6 font-body-md text-body-md text-on-surface-variant">
            <span>${r.aantal} × ${r.tas}</span><span class="whitespace-nowrap">${euro.format(r.bedrag)}</span>
          </div>`).join('')}
        <div class="flex justify-between gap-6 font-body-md text-body-md text-secondary">
          <span>${bestelling.levering}</span>
          <span class="whitespace-nowrap">${bestelling.opAanvraag ? 'Op aanvraag'
            : bestelling.verzendkost ? euro.format(bestelling.verzendkost) : 'Gratis'}</span>
        </div>
      </div>
      <div class="stitch-divider"></div>
      <div class="flex justify-between items-center mt-8 font-headline-md text-headline-md text-on-surface-variant">
        <span>${bestelling.opAanvraag ? 'Voorlopig' : 'Te betalen'}</span>
        <span>${euro.format(bestelling.totaal)}${bestelling.opAanvraag ? ' + verzending' : ''}</span>
      </div>
    </div>

    ${bestelling.viaMollie ? `
    <div class="bg-surface-container-lowest p-8 md:p-10 border-2 border-dashed border-secondary/60 rounded-lg mb-8">
      <h2 class="font-headline-md text-headline-md text-primary mb-4">Je betaling wordt verwerkt</h2>
      <p class="font-body-md text-body-md text-on-surface-variant mb-4">
        Zodra ze bevestigd is, gaat je tas op mijn werkbank klaarstaan en krijg je een bericht van mij.
        Meestal is dat binnen enkele minuten.
      </p>
      <p class="font-body-md text-body-md text-on-surface-variant">
        Ging er iets mis met het betalen? Dan is er nog niets afgerekend en blijft je tas gewoon beschikbaar —
        <a data-wa="Dag Karolien, mijn betaling voor ${mededeling} lukte niet. " target="_blank" rel="noopener"
           class="text-primary border-b border-secondary-fixed-dim hover:border-primary transition-colors">laat het me even weten</a>.
      </p>
    </div>` : `
    ${bestelling.opAanvraag ? `
    <div class="bg-surface-container-lowest p-8 md:p-10 border-2 border-dashed border-secondary/60 rounded-lg mb-8">
      <h2 class="font-headline-md text-headline-md text-primary mb-4">Ik zoek je verzendkost op</h2>
      <p class="font-body-md text-body-md text-on-surface-variant mb-4">
        Er is nog niets afgerekend. Voor ${bestelling.klant.land || 'jouw land'} moet ik de verzending eerst
        navragen — je krijgt binnen twee werkdagen het bedrag van me, met de gegevens om te betalen.
      </p>
      <p class="font-body-md text-body-md text-on-surface-variant">
        Zolang hou ik je tas voor je vrij. Klopt er iets niet, laat het gerust weten.
      </p>
    </div>` : `
    <div class="bg-surface-container-lowest p-8 md:p-10 border-2 border-dashed border-secondary/60 rounded-lg mb-8">
      <h2 class="font-headline-md text-headline-md text-primary mb-6">Overschrijven</h2>
      <dl class="space-y-4 font-body-md text-body-md">
        <div class="flex flex-col sm:flex-row sm:justify-between gap-1 pb-4 border-b border-surface-variant">
          <dt class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Begunstigde</dt>
          <dd class="text-primary">${CONTACT.atelier}</dd>
        </div>
        <div class="flex flex-col sm:flex-row sm:justify-between gap-1 pb-4 border-b border-surface-variant">
          <dt class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">IBAN</dt>
          <dd class="text-primary font-semibold">${CONTACT.iban}</dd>
        </div>
        <div class="flex flex-col sm:flex-row sm:justify-between gap-1 pb-4 border-b border-surface-variant">
          <dt class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Bedrag</dt>
          <dd class="text-primary font-semibold">${euro.format(bestelling.totaal)}</dd>
        </div>
        <div class="flex flex-col sm:flex-row sm:justify-between gap-1">
          <dt class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Mededeling</dt>
          <dd class="text-primary font-semibold">${mededeling}</dd>
        </div>
      </dl>
      <p class="font-body-md text-body-md text-on-surface-variant mt-8">
        Ik hou je tas 5 dagen voor je vrij. Zodra de betaling binnen is, pak ik hem in en gaat hij op de post —
        je krijgt dan een berichtje met het volgnummer.
      </p>
    </div>`}

    <div class="bg-surface-container-low p-8 border-l-[3px] border-secondary">
      <h2 class="font-headline-md text-headline-md text-primary mb-3">Stuur je bestelling even door</h2>
      <p class="font-body-md text-body-md text-on-surface-variant mb-6">
        Zo weet ik meteen dat ze binnen is. Eén klik en de mail staat al klaar — jij hoeft enkel te verzenden.
      </p>
      <div class="flex flex-wrap gap-4">
        <a id="mailknop" class="inline-flex items-center gap-2 bg-primary text-on-primary px-6 py-3 rounded font-label-sm text-label-sm uppercase tracking-widest hover:bg-tertiary transition-colors">
          <span class="material-symbols-outlined text-base">mail</span> Bevestig per mail
        </a>
        <a data-wa="Dag Karolien, ik heb net bestelling ${mededeling} geplaatst. " target="_blank" rel="noopener"
           class="inline-flex items-center gap-2 stitched-border text-primary px-6 py-3 rounded font-label-sm text-label-sm uppercase tracking-widest hover:bg-surface transition-colors">
          <span class="material-symbols-outlined text-base">chat</span> Of via WhatsApp
        </a>
      </div>
    </div>`}`;

  const mailknop = document.getElementById('mailknop');
  if (mailknop) mailknop.href =
    `mailto:${CONTACT.email}?subject=${encodeURIComponent('Bestelling ' + mededeling)}&body=${encodeURIComponent(mailBody)}`;
  root.querySelectorAll('[data-wa]').forEach((el) => { el.href = wa(el.dataset.wa); });
});
</script>
</body>
</html>
